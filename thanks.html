<!DOCTYPE html>
<html lang="lv">
<head>
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Google Analytics, loaded only after consent -->
<link rel="stylesheet" href="/css/consent.css">
<script src="/js/consent.js" defer></script>
<title>Paldies! · ZIEDIŅA ĢILDE</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/fonts.css">
<style>
  h1, h2, h3, h4, h5, h6 { text-transform: uppercase; }
  :root {
    --iron: #1A1E24;
    --concrete: #E8EAED;
    --guild-pink: #E7B8C4;
    --body-muted: #9CA3AF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--iron);
    color: var(--concrete);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 24px;
  }
  .grain {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: .2;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  .logo { width: 64px; height: 64px; object-fit: contain; filter: invert(1); opacity: .95; margin-bottom: 28px; }
  .code {
    font: 600 14px 'Inter', system-ui, sans-serif;
    color: var(--guild-pink);
    letter-spacing: .16em;
    text-transform: uppercase;
    margin: 0 0 16px;
  }
  h1 {
    font-size: clamp(34px, 6vw, 56px);
    font-weight: 800;
    letter-spacing: -.02em;
    text-transform: uppercase;
    color: #fff;
    margin: 0 0 14px;
    line-height: 1.1;
  }
  p { color: var(--body-muted); font-size: 16px; line-height: 1.6; max-width: 480px; margin: 0 0 34px; }
  p .en { display: block; margin-top: 6px; font-size: 14px; opacity: .8; }
  .pill {
    display: inline-block;
    font: 600 14px 'Inter', system-ui, sans-serif;
    color: var(--guild-pink);
    letter-spacing: .1em;
    text-transform: uppercase;
    text-decoration: none;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(231, 184, 196, .4);
  }
  .pill:hover { border-bottom-color: var(--guild-pink); }
  .legal { display: block; margin-top: 26px; font: 500 12.5px 'Inter', system-ui, sans-serif; color: var(--body-muted); text-decoration: none; opacity: .8; }
  .legal:hover { opacity: 1; color: var(--guild-pink); }
</style>
</head>
<body>
<div class="grain"></div>
<img class="logo" src="/assets/logo-transparent.png" alt="ZIEDIŅA ĢILDE">
<p class="code">Ziņa nosūtīta</p>
<h1>Paldies!</h1>
<p>Mēs saņēmām jūsu ziņu un drīzumā atbildēsim.<span class="en">We've received your message and will get back to you soon.</span></p>
<a class="pill" href="/">← Atpakaļ uz sākumu / Back home</a>
<a class="legal" href="/privacy.html">Privātuma politika / Privacy policy</a>
</body>
</html>
