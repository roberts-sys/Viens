# The site is plain static HTML served straight from the repo root.
#
# This is pinned explicitly because the root package.json (the Vite + React
# component sandbox under app/) would otherwise trip Netlify's build
# auto-detection. That would run `vite build`, which writes to app-dist/ --
# the sandbox only -- and publish that instead of the actual website.

[build]
  command = ""
  publish = "."

# --- Security headers -------------------------------------------------------
#
# CSP notes (verified against the actual markup, not guessed):
#   script-src  'unsafe-inline' is required: every page carries an inline
#               redirect snippet and a `classList.add("js")` block in <head>,
#               plus JSON-LD. gc.zgo.at serves the GoatCounter script.
#   style-src   'unsafe-inline' is required: 64 inline style="" attributes
#               across the pages, plus <style> blocks in 404/thanks.
#   connect-src GoatCounter reports pageviews with navigator.sendBeacon(),
#               which CSP governs under connect-src -- NOT img-src. Removing
#               the goatcounter origin here silently breaks analytics.
#   img/font/media are otherwise first-party. The one data: URI on the site
#   is MapLibre's own CSS (assets/vendor/maplibre-gl.css), which draws its
#   zoom/compass control icons as inline data:image/svg+xml -- img-src needs
#   data: or those icons render blank (the map itself still works either way).
#   Google Analytics (js/consent.js, loaded only after opt-in) needs
#   googletagmanager.com to serve gtag and *.google-analytics.com /
#   *.analytics.google.com to receive hits. Drop those and GA fails silently
#   for every visitor who accepted the consent bar.
#   The homepage location map (js/main.js initLiveMap, vendored Leaflet)
#   pulls street tiles from *.tile.openstreetmap.org and satellite tiles
#   from server.arcgisonline.com under img-src -- no separate connect-src
#   entry is needed since Leaflet loads tiles as plain <img> requests and
#   the marker coordinates are baked into the page, not geocoded live.
#   The map's 3D toggle lazy-loads MapLibre GL (also vendored) only on
#   first click, and fetches its style/vector-tiles/glyphs/sprites from
#   tiles.openfreemap.org via fetch/XHR, so that host goes under
#   connect-src rather than img-src. MapLibre's worker is loaded from the
#   same-origin assets/vendor/ file (the CSP build), not a blob: URL, so
#   no worker-src change is needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), usb=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://*.tile.openstreetmap.org https://server.arcgisonline.com; font-src 'self'; media-src 'self'; connect-src 'self' https://ziedinagilde.goatcounter.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://tiles.openfreemap.org; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Netlify was serving this as text/html, so browsers and Googlebot dropped
# every unrecognized XML tag and rendered raw text on one line -- this is
# why Search Console flagged "Sitemap is HTML". Force the real MIME type.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Long-lived caching for immutable assets (fonts are content-named).
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Stop serving build metadata --------------------------------------------
# `publish = "."` puts the repo root on the web. Netlify already withholds
# dotfiles, app/ and the config files, but these two are reachable and only
# serve to fingerprint the dependency tree.

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
